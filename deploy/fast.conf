# Despliegue directo con atm-deploy (Mac -> VPS, sin GitHub Actions). Ver ../../tools/atm-deploy.
# El build corre en una copia sin .env (igual que Docker): la consola usa sus rutas relativas de producción.
APP_DIR=/opt/console-web
PREBUILT=builder

fast_checks() { pnpm lint; }

fast_build() {
	pnpm build
	copy_out dist builder/app/dist
}
