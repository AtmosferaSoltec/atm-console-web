# nginx of the console container. The host nginx (TLS, the domain) proxies here
# and also forwards /v1 to auth-api, so the console talks to the API on its own
# origin and nothing is needed for the API in this container.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Vite names these files by content hash: they never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.inc;
        try_files $uri =404;
    }

    # Every other route is the app (client-side routing, e.g. /auth/systems);
    # index.html is never cached so a new deploy shows up on the next visit.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.inc;
        try_files $uri $uri/ /index.html;
    }
}
